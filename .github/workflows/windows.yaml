name: Windows Build

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    # Same versions as the Dockerfile
    env:
      SDL_VERSION: release-3.4.18
      IMGUI_VERSION: v1.92.9b-docking

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # SDL3 and Dear ImGui aren't installed from packages; they are built below like in the Dockerfile
    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: git
        pacboy: >-
          toolchain:p cmake:p ninja:p pkgconf:p
          nlohmann-json:p lcms2:p libpng:p libjpeg-turbo:p libtiff:p libwebp:p giflib:p zlib:p
          freetype:p harfbuzz:p fontconfig:p fribidi:p libunibreak:p

    - name: Configure
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="$(cygpath -m "$PWD/deps/sdl3")" \
          -DIMGUI_DIR="$(cygpath -m "$PWD/deps/imgui")"

    - name: Build
      run: cmake --build build

    # Smoke test: the CLI starts, decodes a JPEG, writes a PNG and reads it back
    - name: Test
      run: |
        set -e
        cli="$(find build -name photoc-cli.exe | head -n 1)"
        test -n "$cli"
        "$cli" --help
        "$cli" convert assets/photoc-icon.jpg build/smoke.png
        "$cli" info build/smoke.png --compact
